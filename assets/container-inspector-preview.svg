<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
<title id="title">Container Inspector</title><desc id="desc">Eine Minecraft-Kiste neben einer Anzeige mit Gegenständen und Kategorien.</desc>
